name: Buscador de Productos — scrape + análisis

on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12h (0, 12 UTC)
  workflow_dispatch:
    inputs:
      niche:
        description: "Nicho específico (vacío = todos los pendientes/vencidos)"
        required: false
        default: ""
  # Cold start on-demand: el route /search dispara este evento cuando un usuario
  # consulta un nicho nuevo (lib/product-hunter/github.ts).
  repository_dispatch:
    types: [scrape-niche]

# Concurrencia: una sola corrida a la vez para no duplicar trabajo.
concurrency:
  group: scrape-productos
  cancel-in-progress: false

jobs:
  scrape:
    # Self-hosted runner en la máquina de Isaac: Meta Ads Library sirve resultados
    # vacíos a las IPs de datacenter de GitHub (Azure). Necesita IP residencial.
    runs-on: self-hosted
    # En self-hosted los minutos no se cobran. --all tarda ~3-5h; 10h da headroom
    # de sobra sin acercarse al cron de 12h (la concurrencia evita solapamientos).
    timeout-minutes: 600
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Nicho objetivo: input manual o payload del repository_dispatch (cold start)
      NICHE: ${{ github.event.inputs.niche || github.event.client_payload.niche || '' }}
      # Para abaratar el análisis: descomentar y usar Haiku
      # PH_ANTHROPIC_MODEL: claude-haiku-4-5-20251001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # Sin --with-deps: el runner es tu máquina, las libs del sistema ya están
        # instaladas (corres el scraper local). Evita pedir sudo en el runner.
        run: npx playwright install chromium

      # ── Paso 1: scraping (la única llamada LLM aquí es la expansión de
      #    keywords de nichos nuevos: una llamada Haiku por nicho, cacheada) ──
      - name: Scrape
        run: |
          if [ -n "$NICHE" ]; then
            npx tsx scripts/scrape.ts --niche "$NICHE"
          else
            npx tsx scripts/scrape.ts --all
          fi

      # ── Paso 2: análisis Anthropic en batch (solo productos sin score) ──
      # Único punto donde se gasta Anthropic en volumen. Nunca corre en Vercel.
      - name: Analyze
        run: |
          if [ -n "$NICHE" ]; then
            npx tsx scripts/analyze.ts --niche "$NICHE"
          else
            npx tsx scripts/analyze.ts
          fi

      # ── Paso 2.5: garantía de output — nichos sin ganadores se re-scrapean
      #    una vez en US/ES (fallback del modelo original, $0 LLM) ──
      - name: Expand uncovered niches
        run: |
          if [ -n "$NICHE" ]; then
            npx tsx scripts/expand-uncovered.ts --niche "$NICHE"
          else
            npx tsx scripts/expand-uncovered.ts
          fi

      # ── Paso 2.6: re-análisis de lo que trajo la ampliación (no-op si nada) ──
      - name: Analyze expanded
        run: |
          if [ -n "$NICHE" ]; then
            npx tsx scripts/analyze.ts --niche "$NICHE"
          else
            npx tsx scripts/analyze.ts
          fi

      # ── Paso 3: validación PE en vivo (solo candidatos alta/media, $0 LLM) ──
      # Busca los peSearchTerms de cada candidato prometedor en Meta filtrando
      # por Perú y reclasifica el escenario con competidores reales de hoy.
      - name: Validate PE (live)
        run: |
          if [ -n "$NICHE" ]; then
            npx tsx scripts/validate-pe.ts --niche "$NICHE"
          else
            npx tsx scripts/validate-pe.ts
          fi
